name: Validate Approved Deep Narrator Export

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aidoc-export-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-export:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg and browser driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          npm install puppeteer-core@24
      - name: Import through browser-supported audio bridge
        run: |
          cat > bridge-test.cjs <<'NODE'
          const fs = require('node:fs');
          const puppeteer = require('puppeteer-core');
          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            try {
              const page = await browser.newPage();
              page.on('console', msg => console.log('browser:', msg.text()));
              page.on('pageerror', err => console.error('pageerror:', err.message));
              await page.goto('https://e17a3f9c7f3b3e373e.v2.appdeploy.ai/', { waitUntil: 'networkidle2', timeout: 120000 });
              await page.click('#importButton');
              await page.waitForFunction(() => {
                const result = document.querySelector('#result');
                return Boolean(result?.querySelector('a')) || Boolean(result?.textContent?.startsWith('Import failed:'));
              }, { timeout: 180000 });
              const state = await page.$eval('#result', el => ({ text: el.textContent || '', href: el.querySelector('a')?.href || '' }));
              console.log(JSON.stringify(state, null, 2));
              if (!state.href) throw new Error(state.text || 'Bridge returned no signed URL');
              fs.writeFileSync('signed-url.txt', state.href + '\n');
            } finally {
              await browser.close();
            }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node bridge-test.cjs
          signed_url="$(cat signed-url.txt)"
          curl -fL --retry 3 --retry-delay 2 "$signed_url" -o narrator-test.bin
          test -s narrator-test.bin
          file narrator-test.bin
          ffprobe -v error -show_entries format=format_name,duration,size -of json narrator-test.bin | tee narrator-test.probe.json
          ffmpeg -v error -i narrator-test.bin -f null -
          sha256sum narrator-test.bin | tee narrator-test.sha256
      - name: Upload validated test file
        uses: actions/upload-artifact@v4
        with:
          name: approved-deep-narrator-export-test
          path: |
            narrator-test.bin
            narrator-test.sha256
            narrator-test.probe.json
          if-no-files-found: error
          retention-days: 1
