name: Export Kokoro Runtime Bundle

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/export-kokoro-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download Python wheels and official model files
        run: |
          set -euxo pipefail
          mkdir -p bundle/wheels bundle/models
          python -m pip install --upgrade pip
          python -m pip download --only-binary=:all: \
            'kokoro-onnx==0.5.0' soundfile numpy pillow \
            --dest bundle/wheels
          curl -fL --retry 5 --retry-delay 3 \
            'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx' \
            -o bundle/models/kokoro-v1.0.int8.onnx
          curl -fL --retry 5 --retry-delay 3 \
            'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin' \
            -o bundle/models/voices-v1.0.bin
          test -s bundle/models/kokoro-v1.0.int8.onnx
          test -s bundle/models/voices-v1.0.bin
          sha256sum bundle/models/* bundle/wheels/* > bundle/SHA256SUMS.txt
          du -sh bundle
      - name: Upload portable runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-runtime-linux-python313
          path: bundle/
          if-no-files-found: error
          compression-level: 1
          retention-days: 2
