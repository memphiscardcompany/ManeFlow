name: Normalize mobile lockfile

on:
  push:
    branches:
      - codex/ebay-live-market-pricing-20260807
    paths:
      - apps/mobile-expo/package.json

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/ebay-live-market-pricing-20260807
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Pin reviewed npm toolchain
        run: npm install --global npm@11.16.0 --no-audit --no-fund
      - name: Regenerate mobile lockfile from package overrides
        working-directory: apps/mobile-expo
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify patched transitive versions
        working-directory: apps/mobile-expo
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          if (lock.packages['node_modules/brace-expansion']?.version !== '5.0.9') throw new Error('brace-expansion not patched to 5.0.9');
          if (lock.packages['node_modules/js-yaml']?.version !== '4.3.1') throw new Error('js-yaml not patched to 4.3.1');
          NODE
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- apps/mobile-expo/package-lock.json; then
            echo 'Lockfile already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile-expo/package-lock.json
          git commit -m 'fix: patch mobile transitive audit dependencies'
          git push origin HEAD:codex/ebay-live-market-pricing-20260807
