name: Build ManeFlow iOS and Android Store Release

on:
  workflow_dispatch:
    inputs:
      submit_after_build:
        description: Submit the exact builds from this run after the production environment is approved
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify_and_build_mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      ios_build_id: ${{ steps.capture_build_evidence.outputs.ios_build_id }}
      android_build_id: ${{ steps.capture_build_evidence.outputs.android_build_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile-expo/package-lock.json

      - name: Pin the reviewed npm toolchain
        run: npm install --global npm@11.16.0 --no-audit --no-fund

      - name: Require Expo access token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: test -n "$EXPO_TOKEN" || (echo "EXPO_TOKEN is not configured" && exit 1)

      - name: Install core dependencies
        run: npm install --omit=optional --no-audit --no-fund

      - name: Verify ManeFlow release contracts
        run: |
          npm run check
          npm run security:scan
          npm test
          npm run mobile:check
          npm run store:check

      - name: Install mobile dependencies
        working-directory: apps/mobile-expo
        run: npm ci --no-audit --no-fund

      - name: Install EAS CLI
        run: npm install --global eas-cli@16.32.0

      - name: Verify Expo account
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: Build signed iOS and Android production artifacts
        working-directory: apps/mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform all --profile production --non-interactive --wait --json > "$RUNNER_TEMP/eas-builds.json"

      - name: Bind build evidence to this commit
        id: capture_build_evidence
        run: |
          app_version="$(node -p "JSON.parse(require('node:fs').readFileSync('apps/mobile-expo/app.json', 'utf8')).expo.version")"
          node scripts/capture-eas-build-evidence.mjs \
            --input "$RUNNER_TEMP/eas-builds.json" \
            --output reports/mobile-release-evidence.json \
            --github-output "$GITHUB_OUTPUT" \
            --expected-commit "$GITHUB_SHA" \
            --expected-profile production \
            --expected-app-version "$app_version" \
            --source-ref "$GITHUB_REF" \
            --workflow-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload commit-bound mobile build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ManeFlow-Mobile-Build-Evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/mobile-release-evidence.json
          if-no-files-found: error
          retention-days: 90

  submit-mobile:
    name: Submit exact mobile builds
    needs: verify_and_build_mobile
    if: ${{ inputs.submit_after_build }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: mobile-store-production
    concurrency:
      group: maneflow-mobile-store-production
      cancel-in-progress: false
    env:
      IOS_BUILD_ID: ${{ needs.verify_and_build_mobile.outputs.ios_build_id }}
      ANDROID_BUILD_ID: ${{ needs.verify_and_build_mobile.outputs.android_build_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile-expo/package-lock.json

      - name: Pin the reviewed npm toolchain
        run: npm install --global npm@11.16.0 --no-audit --no-fund

      - name: Require promotion credentials and exact build IDs
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || (echo "EXPO_TOKEN is not configured" && exit 1)
          test -n "$IOS_BUILD_ID" || (echo "The iOS build ID is missing" && exit 1)
          test -n "$ANDROID_BUILD_ID" || (echo "The Android build ID is missing" && exit 1)

      - name: Install mobile dependencies
        working-directory: apps/mobile-expo
        run: npm ci --no-audit --no-fund

      - name: Install EAS CLI
        run: npm install --global eas-cli@16.32.0

      - name: Verify Expo account
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: Submit exact production builds
        working-directory: apps/mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas submit --platform ios --profile production --id "$IOS_BUILD_ID" --non-interactive --wait
          eas submit --platform android --profile production --id "$ANDROID_BUILD_ID" --non-interactive --wait
