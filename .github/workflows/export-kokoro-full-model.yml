name: Export Kokoro Full Precision Model

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/export-kokoro-full-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download official full precision model
        run: |
          set -euxo pipefail
          mkdir -p model
          curl -fL --retry 5 --retry-delay 3 \
            'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx' \
            -o model/kokoro-v1.0.onnx
          test -s model/kokoro-v1.0.onnx
          sha256sum model/kokoro-v1.0.onnx > model/SHA256SUMS.txt
          ls -lh model
      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-full-precision-model
          path: model/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
