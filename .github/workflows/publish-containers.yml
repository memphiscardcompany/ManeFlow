name: Publish ManeFlow containers

on:
  workflow_run:
    workflows: ["Verify ManeFlow"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character main-branch commit SHA that already passed Verify ManeFlow
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write

concurrency:
  group: container-release-${{ github.event.workflow_run.head_sha || inputs.release_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: release / signed containers
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REGISTRY: ghcr.io
      COSIGN_YES: "true"
    steps:
      - name: Resolve exact release commit
        id: release
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.release_sha }}
          SOURCE_VERIFY_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            release_sha="${WORKFLOW_RUN_SHA}"
            source_verify_run_id="${SOURCE_VERIFY_RUN_ID}"
          else
            release_sha="${MANUAL_SHA}"
            source_verify_run_id="manual-verification-below"
          fi
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Release SHA must be a full lowercase 40-character commit." >&2
            exit 64
          }
          printf 'sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"
          printf 'source_verify_run_id=%s\n' "$source_verify_run_id" >> "$GITHUB_OUTPUT"

      - name: Check out exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove commit is merged to main and verified
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          test -z "$(git status --porcelain)"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            runs="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${RELEASE_SHA}&status=completed&per_page=100")"
            jq -e '[.workflow_runs[] | select(
              .name == "Verify ManeFlow" and
              .event == "push" and
              .head_branch == "main" and
              .head_sha == $sha and
              .conclusion == "success"
            )] | length > 0' --arg sha "$RELEASE_SHA" <<<"$runs" >/dev/null || {
              echo "No successful main-branch Verify ManeFlow run exists for ${RELEASE_SHA}." >&2
              exit 65
            }
          fi

      - name: Resolve private image names
        id: images
        run: |
          set -Eeuo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf 'application=%s/%s/maneflow\n' "$REGISTRY" "$owner" >> "$GITHUB_OUTPUT"
          printf 'vision=%s/%s/maneflow-vision\n' "$REGISTRY" "$owner" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push ManeFlow application
        id: application
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.application }}:sha-${{ steps.release.outputs.sha }}
          labels: |
            org.opencontainers.image.title=ManeFlow
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.version=sha-${{ steps.release.outputs.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=maneflow-application
          cache-to: type=gha,mode=max,scope=maneflow-application

      - name: Build and push ManeFlow vision worker
        id: vision
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./vision-worker
          file: ./vision-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.vision }}:sha-${{ steps.release.outputs.sha }}
          labels: |
            org.opencontainers.image.title=ManeFlow Vision Worker
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.version=sha-${{ steps.release.outputs.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=maneflow-vision
          cache-to: type=gha,mode=max,scope=maneflow-vision

      - name: Validate immutable image digests
        env:
          APPLICATION_DIGEST: ${{ steps.application.outputs.digest }}
          VISION_DIGEST: ${{ steps.vision.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "$APPLICATION_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$VISION_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$APPLICATION_DIGEST" != "$VISION_DIGEST"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 / Cosign v3.0.6

      - name: Sign and verify both private images
        env:
          APPLICATION_IMAGE: ${{ steps.images.outputs.application }}
          APPLICATION_DIGEST: ${{ steps.application.outputs.digest }}
          VISION_IMAGE: ${{ steps.images.outputs.vision }}
          VISION_DIGEST: ${{ steps.vision.outputs.digest }}
        run: |
          set -Eeuo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-containers.yml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"

          cosign sign --yes "${APPLICATION_IMAGE}@${APPLICATION_DIGEST}"
          cosign sign --yes "${VISION_IMAGE}@${VISION_DIGEST}"

          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "${APPLICATION_IMAGE}@${APPLICATION_DIGEST}" >/dev/null
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "${VISION_IMAGE}@${VISION_DIGEST}" >/dev/null

      - name: Generate signed release manifest
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          SOURCE_VERIFY_RUN_ID: ${{ steps.release.outputs.source_verify_run_id }}
          APPLICATION_IMAGE: ${{ steps.images.outputs.application }}
          APPLICATION_DIGEST: ${{ steps.application.outputs.digest }}
          VISION_IMAGE: ${{ steps.images.outputs.vision }}
          VISION_DIGEST: ${{ steps.vision.outputs.digest }}
        run: |
          set -Eeuo pipefail
          mkdir -p release
          node scripts/create-container-release-manifest.mjs \
            --source-commit "$RELEASE_SHA" \
            --source-verify-run-id "$SOURCE_VERIFY_RUN_ID" \
            --release-workflow-run-id "$GITHUB_RUN_ID" \
            --application-image "$APPLICATION_IMAGE" \
            --application-digest "$APPLICATION_DIGEST" \
            --vision-image "$VISION_IMAGE" \
            --vision-digest "$VISION_DIGEST" \
            --output release/container-release-manifest.json

          cosign sign-blob --yes \
            --bundle release/container-release-manifest.sigstore.json \
            release/container-release-manifest.json

          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-containers.yml@refs/heads/main"
          cosign verify-blob \
            --bundle release/container-release-manifest.sigstore.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            release/container-release-manifest.json

          (
            cd release
            sha256sum container-release-manifest.json container-release-manifest.sigstore.json > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload signed release manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: maneflow-container-release-${{ steps.release.outputs.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Record immutable release references
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          APPLICATION_IMAGE: ${{ steps.images.outputs.application }}
          APPLICATION_DIGEST: ${{ steps.application.outputs.digest }}
          VISION_IMAGE: ${{ steps.images.outputs.vision }}
          VISION_DIGEST: ${{ steps.vision.outputs.digest }}
        run: |
          {
            echo '## Signed ManeFlow container release'
            echo
            echo "- Source commit: \`${RELEASE_SHA}\`"
            echo "- Application: \`${APPLICATION_IMAGE}@${APPLICATION_DIGEST}\`"
            echo "- Vision: \`${VISION_IMAGE}@${VISION_DIGEST}\`"
            echo '- Signing: Sigstore keyless OIDC signature verified in this workflow.'
            echo '- Deployment: not performed by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
