<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ManeFlow</title>
<style>
:root{color-scheme:dark;font-family:Inter,Segoe UI,system-ui,sans-serif;background:#07100c;color:#f8f5ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 75% 10%,rgba(224,185,87,.17),transparent 28rem),linear-gradient(145deg,#07100c,#0a1118)}main{width:min(680px,88vw);padding:42px;border:1px solid #3a3424;border-radius:30px;background:rgba(13,17,24,.94);box-shadow:0 36px 120px rgba(0,0,0,.55)}.brand{display:flex;align-items:center;gap:14px;margin-bottom:34px}.mark{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;border:1px solid #9e7e34;background:linear-gradient(145deg,#2d2514,#10141b);color:#f4d983;font-size:30px;font-weight:950}.brand strong{display:block;font-size:24px}.brand small{display:block;color:#99a4b4;letter-spacing:1.8px;text-transform:uppercase;font-size:10px;margin-top:3px}.eyebrow{color:#f4d983;text-transform:uppercase;letter-spacing:2px;font-size:10px;font-weight:900}h1{font-size:38px;letter-spacing:-1.8px;margin:10px 0 12px}p{color:#aab4c2;line-height:1.6}.track{height:8px;border-radius:999px;background:#17202a;overflow:hidden;margin-top:26px}.bar{height:100%;width:8%;background:linear-gradient(90deg,#c99d3f,#f4d983);transition:width .35s ease}.status{margin-top:13px;font-size:12px;color:#c6cfda;min-height:20px}.foot{margin-top:26px;padding-top:18px;border-top:1px solid #252d38;color:#717d8c;font-size:11px}
</style>
</head>
<body><main><div class="brand"><div class="mark">M</div><div><strong>ManeFlow</strong><small>Card intelligence</small></div></div><div class="eyebrow">Private beta</div><h1>Preparing your card workspace</h1><p>ManeFlow is starting its local database, pricing engine, and card recognition services.</p><div class="track"><div class="bar" id="bar"></div></div><div class="status" id="status">Loading ManeFlow…</div><div class="foot">Your local card images and inventory stay on this PC unless you explicitly enable a connected service.</div></main><script>
const bar=document.querySelector('#bar');const status=document.querySelector('#status');
window.maneFlowDesktop?.onStartupProgress?.((event)=>{bar.style.width=`${Math.max(8,Math.min(100,event.progress||8))}%`;status.textContent=event.message||'Starting ManeFlow…';});
</script></body></html>
